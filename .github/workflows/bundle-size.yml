name: Bundle size

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: bundle-size-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bundle-size:
    name: Bundle size
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: true
      VITE_BASE_PATH: /slamdemonium/
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # The manifest maps hash filenames to stable identities; application bytes
      # match the normal production build. This workflow never publishes dist.
      - name: Build production assets with measurement manifest
        run: npm run build -- --manifest

      - name: Enforce the reviewed budget and publish size history
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/bundle_size.py

      - name: Retain measurements and summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-size-results
          path: |
            test-results/bundle-size.json
            test-results/bundle-size.md
          retention-days: 90
          if-no-files-found: warn
