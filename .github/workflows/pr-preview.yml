name: Build PR Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: preview-build-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build PR Preview
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out proposed merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build preview
        run: npm run build
        env:
          VITE_BASE_PATH: /slamdemonium/pr/${{ github.event.number }}/

      - name: Write lifecycle smoke marker (temporary)
        run: echo preview-smoke-one > dist/preview-smoke.txt

      # A separate workflow on main consumes these files as data, never as code.
      - name: Upload preview files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-${{ github.event.number }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
