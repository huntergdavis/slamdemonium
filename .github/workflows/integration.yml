name: Vehicle integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vehicle-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integration:
    name: Vehicle integration regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CI: true
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run real Jolt and vehicle integration regressions
        shell: bash
        run: |
          mkdir -p scratch
          npm run test:integration 2>&1 | tee scratch/wp9b-integration.log

      - name: Retain scenario metrics and diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wp9b-integration-results
          path: |
            scratch/wp9b-integration.json
            scratch/wp9b-integration.log
          if-no-files-found: warn
          retention-days: 90
