name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Build PR Preview]
    types: [completed]
  # This privileged event only removes static files; it never checks out PR code.
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false
  queue: max

jobs:
  build:
    name: Build Pages
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Record production source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install dependencies
        run: npm ci

      - name: Build project site
        run: npm run build
        env:
          VITE_BASE_PATH: /slamdemonium/

      - name: Upload production files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-production
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy Pages
    needs: build
    if: >-
      !cancelled() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pull-requests: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out trusted publisher from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      # Artifacts are validated and copied as bytes. No PR scripts, npm installs,
      # actions, or executables run in this job. gh-pages is storage, not a Pages source.
      - name: Prepare production and preview snapshot
        id: snapshot
        run: python3 .github/scripts/pages.py prepare
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
          PRODUCTION_SHA: ${{ needs.build.outputs.sha }}

      - name: Upload complete Pages site
        if: steps.snapshot.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Deploy to GitHub Pages
        if: steps.snapshot.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Update sticky preview comment after deployment
        if: steps.snapshot.outputs.publish == 'true'
        run: python3 .github/scripts/pages.py comment
        env:
          GH_TOKEN: ${{ github.token }}
