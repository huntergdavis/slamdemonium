<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Car visual preview</title>
    <style>
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        background: #b8c7cc;
        color: #f2f6f8;
        font: 14px system-ui;
      }
      nav {
        position: fixed;
        z-index: 1;
        top: 16px;
        left: 16px;
        max-width: calc(100vw - 56px);
        padding: 12px;
        background: #121a23f0;
        border-radius: 8px;
      }
      button,
      select {
        font: inherit;
        background: #253341;
        color: inherit;
        border: 1px solid #acbbc7;
        padding: 7px;
        border-radius: 4px;
        margin: 4px 3px 4px 0;
      }
      button {
        cursor: pointer;
      }
      :focus-visible {
        outline: 2px solid #6fe4ff;
        outline-offset: 2px;
      }
      p {
        margin: 5px 0;
        font-size: 12px;
        color: #acbbc7;
      }
      label {
        display: inline-block;
        margin-right: 8px;
      }
      #status {
        font-variant-numeric: tabular-nums;
      }
      .heading {
        color: #fff4b3;
      }
      .velocity {
        color: #3ed8ee;
      }
      .force {
        color: #ffd166;
      }
    </style>
  </head>
  <body>
    <nav aria-label="Car preview controls">
      <strong>D4 · car visual test bench</strong>
      <p>
        Synthetic state · car held in place · actual production car and track
        modules
      </p>
      <div>
        <label
          >State
          <select id="mode">
            <option value="cruise">Cruise</option>
            <option value="brake">Full brake</option>
            <option value="reverse">Reverse (no brake)</option>
            <option value="drift">Drift / handbrake</option>
            <option value="spin">Rear wheelspin</option>
            <option value="lock">Rear wheels locked</option>
            <option value="air">Airborne</option>
          </select>
        </label>
        <label><input id="animate" type="checkbox" checked /> Animate</label>
        <button id="gizmos" aria-pressed="true">G · gizmos on</button>
      </div>
      <div>
        <button data-camera="front">Front</button>
        <button data-camera="rear">Rear</button>
        <button data-camera="side">Side</button>
        <button data-camera="top">Top</button>
        <label
          >Steer
          <input id="steer" type="range" min="-32" max="32" value="16" /><output
            id="steer-value"
            >16°</output
          ></label
        >
      </div>
      <p>
        <span class="heading">H heading</span> ·
        <span class="velocity">V velocity</span> ·
        <span class="force">Tire force 1 m / 2 kN (4 m cap)</span>
      </p>
      <p>
        G works with driving-view focus. Controls keep their normal keyboard
        behavior.
      </p>
      <p id="status" role="status">Building preview…</p>
    </nav>
    <div id="app"></div>
    <script type="module" src="preview.js"></script>
  </body>
</html>
