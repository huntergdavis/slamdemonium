<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" href="data:," />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Test track preview</title>
    <style>
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        background: #b8c7cc;
        font: 14px system-ui;
        color: #f2f6f8;
      }
      nav {
        position: fixed;
        z-index: 1;
        left: 16px;
        top: 16px;
        max-width: calc(100vw - 56px);
        background: rgba(18, 26, 35, 0.94);
        padding: 12px;
        border-radius: 8px;
      }
      button {
        color: #f2f6f8;
        background: #253341;
        border: 1px solid #acbbc7;
        border-radius: 4px;
        padding: 8px;
        margin: 4px 4px 4px 0;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid #6fe4ff;
      }
      p {
        margin: 4px 0;
        color: #acbbc7;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <nav>
      <strong>WP3 · live world preview</strong>
      <div>
        <button id="chase">Chase scale</button
        ><button id="overview">Overview</button
        ><button id="infield">Infield</button
        ><button id="tour" aria-pressed="false">Camera tour</button>
        <button id="fog" aria-pressed="true">Fog on</button>
      </div>
      <p>Actual track module · camera-only preview · no vehicle physics</p>
      <p id="status">Building asphalt and geometry…</p>
    </nav>
    <div id="app"></div>
    <script type="module" src="preview.js"></script>
  </body>
</html>
